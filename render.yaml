services:
  - type: web
    name: xuong-app
    runtime: static
    staticPublishPath: .
    headers:
      - path: /data/*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: no-cache
      - path: /quan-tri.html
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
